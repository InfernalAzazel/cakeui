[project]
name = "{{project_name}}"
version = "0.1.0"
description = "{{display_name}}, a CakeUI desktop app"
requires-python = ">=3.11"
dependencies = ["cakeui{{cakeui_requirement}}"]

[tool.cakeui]
name = "{{display_name}}"
entry = "main.py"
web = "web"
web_dist = "web/dist"
package_manager = "{{package_manager}}"

[tool.cakeui.build]
mode = "standalone"
console = false
include_packages = ["pydantic", "pydantic_core"]
