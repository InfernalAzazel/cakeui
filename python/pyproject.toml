[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cakeui"
version = "0.1.0"
description = "Build desktop apps with Python and a web frontend. No Rust, no bundler required."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["desktop", "webview", "pywebview", "gui", "pydantic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = [
    "pydantic>=2.5",
    "pywebview>=5.0",
]

[project.urls]
Homepage = "https://github.com/InfernalAzazel/cakeui"
Repository = "https://github.com/InfernalAzazel/cakeui"
Issues = "https://github.com/InfernalAzazel/cakeui/issues"
Changelog = "https://github.com/InfernalAzazel/cakeui/commits/main"

[tool.hatch.build.targets.wheel]
packages = ["src/cakeui"]
