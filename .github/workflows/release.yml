# 发布到 PyPI：推 `v*` 标签自动发版，也可以在 Actions 页面手动发到 TestPyPI。
#
# 用 Trusted Publishing，仓库里不存任何 API token。首次发布前，在 PyPI 和
# TestPyPI 各配一次 "pending publisher"，两个项目（cakeui、cakeui-cli）都要配：
#   Owner            InfernalAzazel
#   Repository       cakeui
#   Workflow         release.yml
#   Environment      pypi（TestPyPI 那边填 testpypi）
#
# 发布顺序有讲究：cakeui 必须先于 cakeui-cli 存在，否则 `cakeui-cli` 的
# `cakeui>=0.1.0` 依赖在安装时解析不到。这里一次性上传全部产物，正好满足。
#
# 版本号不能复用：PyPI 拒绝任何已存在版本的重传，所以先把两个 pyproject.toml
# 的 version 改成同一个新值，再打标签。

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "发布到哪里"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

# 同一时间只跑一次发布，避免两个任务抢同一个版本号。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: 构建并自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      # 标签和包里的版本不一致是最常见的发版事故，先在这里拦下来。
      - name: 校验版本号与标签一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 - <<'PY'
          import os, pathlib, sys, tomllib

          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          versions = {}
          for path in ("python/pyproject.toml", "cli/pyproject.toml"):
              project = tomllib.loads(pathlib.Path(path).read_text("utf-8"))["project"]
              versions[project["name"]] = project["version"]

          print(f"tag: {tag}")
          for name, version in versions.items():
              print(f"{name}: {version}")

          # 两个包必须同版本，也必须和标签一致，否则发布出去就改不回来了。
          if set(versions.values()) != {tag}:
              sys.exit(f"版本不一致：标签是 {tag}，包是 {versions}")
          PY

      - name: 构建 wheel 和 sdist
        run: uv build --all-packages --out-dir dist

      # --strict：README 渲染失败之类的元数据问题会让 PyPI 页面变成空白。
      - name: twine check --strict
        run: uvx twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: 上传到 ${{ github.event.inputs.target || 'pypi' }}
    needs: build
    runs-on: ubuntu-latest
    # 环境名同时充当 Trusted Publishing 的绑定目标；tag 触发的就是正式发布。
    environment: ${{ github.event.inputs.target || 'pypi' }}
    permissions:
      # Trusted Publishing 靠这个短期 OIDC token，不需要PyPI API token。
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: 上传
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ github.event.inputs.target == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          # 产物已经在上一步校验过，这里不再重复检查。
          verify-metadata: false
