# 发布到 PyPI：推 `v*` 标签自动发版，也可以在 Actions 页面手动触发。
#
# 用 Trusted Publishing，仓库里不存任何 API token。
#
# ## 首次发布前要在 PyPI 配两个 pending publisher
#
# PyPI 的 "pending publisher"（为尚不存在的项目预注册发布者）要求
# (owner, repository, workflow, environment) 四元组唯一，项目名不参与去重。
# 所以一个 workflow + 一个 environment 只能给一个项目占坑，第二个会报：
#   "A pending trusted publisher matching this configuration is already
#    registered for a different project name."
# 这条约束只针对 pending：两个项目都建好之后，发布者配置就可以合并成一套。
# 先在 PyPI 的 "Publishing" 页面各配一次，四个字段都填 release.yml：
#
#   Project name   Owner          Environment
#   cakeui         InfernalAzazel pypi
#   cakeui-cli     InfernalAzazel pypi-cli
#
# ## 顺序
#
# cakeui 先发：`cakeui-cli` 依赖 `cakeui>=0.1.0`，先有运行时才能装。上传本身
# 不校验依赖，但两个包之间若有几秒空档，这期间的用户会装不上。
#
# ## 版本号
#
# PyPI 拒绝任何已存在版本的重传。先把两个 pyproject.toml 的 version 改成同
# 一个新值，再打同名标签。手动触发不走标签，用 pyproject.toml 里的版本号。

name: release

on:
  push:
    tags: ["v*"]
  # 手动触发只用于发布失败后的重试：它按 pyproject.toml 里的版本号发布，
  # 不做标签校验。
  workflow_dispatch:

# 同一时间只跑一次发布，避免两个任务抢同一个版本号。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: 构建并自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      # 标签和包里的版本不一致是最常见的发版事故，先在这里拦下来。
      - name: 校验版本号与标签一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 - <<'PY'
          import os, pathlib, sys, tomllib

          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          versions = {}
          for path in ("python/pyproject.toml", "cli/pyproject.toml"):
              project = tomllib.loads(pathlib.Path(path).read_text("utf-8"))["project"]
              versions[project["name"]] = project["version"]

          print(f"tag: {tag}")
          for name, version in versions.items():
              print(f"{name}: {version}")

          # 两个包必须同版本，也必须和标签一致，否则发布出去就改不回来了。
          if set(versions.values()) != {tag}:
              sys.exit(f"版本不一致：标签是 {tag}，包是 {versions}")
          PY

      - name: 构建 wheel 和 sdist
        run: uv build --all-packages --out-dir dist

      # --strict：README 渲染失败之类的元数据问题会让 PyPI 页面变成空白。
      - name: twine check --strict
        run: uvx twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # 两个包拆成两个 job：cakeui 和 cakeui-cli 的 pending publisher 分别绑在
  # 不同的 environment 上，而一个 job 只能向一个 environment 取 OIDC token。
  # 运行时排在前面，CLI 用 needs 等它，避免"CLI 有了但运行时还没有"的空档。
  publish-runtime:
    name: 上传 cakeui
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted Publishing 靠这个短期 OIDC token，不需要 PyPI API token。
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # 产物里两个包混在一起，这里只挑运行时的。cakeui-* 匹配不到 cakeui_cli-*，
      # 后者用的是下划线。
      - name: 挑出运行时产物
        run: |
          mkdir upload
          mv dist/cakeui-[0-9]* upload/
          ls upload

      - name: 上传
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload/
          # 产物已经在上一步校验过，这里不再重复检查。
          verify-metadata: false

  publish-cli:
    name: 上传 cakeui-cli
    needs: publish-runtime
    runs-on: ubuntu-latest
    environment: pypi-cli
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: 挑出 CLI 产物
        run: |
          mkdir upload
          mv dist/cakeui_cli-* upload/
          ls upload

      - name: 上传
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload/
          verify-metadata: false
