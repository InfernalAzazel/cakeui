# 发布到 PyPI：推 `v*` 标签自动发版，也可以在 Actions 页面手动触发。
#
# 用 Trusted Publishing，仓库里不存任何 API token。发版成功后，标签触发的那次
# 还会在仓库里建一条 GitHub Release（版本说明 + 本次贡献者 + 构建产物）。
#
# ## 首次发布前要在 PyPI 配两个 pending publisher
#
# PyPI 的 "pending publisher"（为尚不存在的项目预注册发布者）要求
# (owner, repository, workflow, environment) 四元组唯一，项目名不参与去重。
# 所以一个 workflow + 一个 environment 只能给一个项目占坑，第二个会报：
#   "A pending trusted publisher matching this configuration is already
#    registered for a different project name."
# 这条约束只针对 pending：两个项目都建好之后，发布者配置就可以合并成一套。
# 先在 PyPI 的 "Publishing" 页面各配一次，四个字段都填 release.yml：
#
#   Project name   Owner          Environment
#   cakeui         InfernalAzazel pypi
#   cakeui-cli     InfernalAzazel pypi-cli
#
# ## 顺序
#
# cakeui 先发：`cakeui-cli` 依赖 `cakeui>=0.1.0`，先有运行时才能装。上传本身
# 不校验依赖，但两个包之间若有几秒空档，这期间的用户会装不上。
#
# ## 版本号
#
# PyPI 拒绝任何已存在版本的重传。先把两个 pyproject.toml 的 version 改成同
# 一个新值，再打同名标签。手动触发不走标签，用 pyproject.toml 里的版本号。
#
# ## GitHub Release
#
# 只有标签触发才会建：手动触发没有标签，release 会指向一个不存在的 ref。
#
# 正文由三块拼成，缺哪块就跳过哪块：
#
#   1. 安装命令（永远在最前面，从标签推出精确版本号）
#   2. 手写的更新日志 `.github/release-notes/vX.Y.Z.md`，没有就用 GitHub 自动
#      生成的说明（What's Changed / Full Changelog）
#   3. 本次贡献者：上一个标签以来的所有提交作者，去重、剔掉 bot。没人时整节不出现
#
# 更新日志目录下有 README 说明格式。手写说明是正文的第一来源，别在 Release
# 页面上改：下次重跑会被覆盖回去。
#
# 这一步要 `contents: write`。如果仓库的 Settings -> Actions -> General 把
# workflow 权限设成了只读，这里会 403，改成 "Read and write permissions"。

name: release

on:
  push:
    tags: ["v*"]
  # 手动触发只用于发布失败后的重试：它按 pyproject.toml 里的版本号发布，
  # 不做标签校验。
  workflow_dispatch:

# 同一时间只跑一次发布，避免两个任务抢同一个版本号。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: 构建并自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      # 标签和包里的版本不一致是最常见的发版事故，先在这里拦下来。
      - name: 校验版本号与标签一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 - <<'PY'
          import os, pathlib, sys, tomllib

          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          versions = {}
          for path in ("python/pyproject.toml", "cli/pyproject.toml"):
              project = tomllib.loads(pathlib.Path(path).read_text("utf-8"))["project"]
              versions[project["name"]] = project["version"]

          print(f"tag: {tag}")
          for name, version in versions.items():
              print(f"{name}: {version}")

          # 两个包必须同版本，也必须和标签一致，否则发布出去就改不回来了。
          if set(versions.values()) != {tag}:
              sys.exit(f"版本不一致：标签是 {tag}，包是 {versions}")
          PY

      - name: 构建 wheel 和 sdist
        run: uv build --all-packages --out-dir dist

      # --strict：README 渲染失败之类的元数据问题会让 PyPI 页面变成空白。
      - name: twine check --strict
        run: uvx twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # 两个包拆成两个 job：cakeui 和 cakeui-cli 的 pending publisher 分别绑在
  # 不同的 environment 上，而一个 job 只能向一个 environment 取 OIDC token。
  # 运行时排在前面，CLI 用 needs 等它，避免"CLI 有了但运行时还没有"的空档。
  publish-runtime:
    name: 上传 cakeui
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted Publishing 靠这个短期 OIDC token，不需要 PyPI API token。
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # 产物里两个包混在一起，这里只挑运行时的。cakeui-* 匹配不到 cakeui_cli-*，
      # 后者用的是下划线。
      - name: 挑出运行时产物
        run: |
          mkdir upload
          mv dist/cakeui-[0-9]* upload/
          ls upload

      - name: 上传
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload/
          # 产物已经在上一步校验过，这里不再重复检查。
          verify-metadata: false

  publish-cli:
    name: 上传 cakeui-cli
    needs: publish-runtime
    runs-on: ubuntu-latest
    environment: pypi-cli
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: 挑出 CLI 产物
        run: |
          mkdir upload
          mv dist/cakeui_cli-* upload/
          ls upload

      - name: 上传
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload/
          verify-metadata: false

  # 发完之后在仓库里留一条可读的版本记录。排在两个上传之后：Release 上挂着的
  # 产物如果对应的包还没进 PyPI，对用户就是个陷阱。
  #
  # 建 Release 交给 softprops/action-gh-release：它的 generate_release_notes
  # 会自动追加 GitHub 生成的说明（What's Changed / New Contributors / Full
  # Changelog），body_path 的内容排在这些说明前面。重跑时它找得到已有的 Release
  # 并更新，不会因为 tag 已发过而失败。
  github-release:
    name: 建 GitHub Release
    needs: [publish-runtime, publish-cli]
    runs-on: ubuntu-latest
    # 手动触发没有标签，建 release 会指向一个不存在的 ref，所以只认标签。
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      # 只为读 `.github/release-notes/` 里的手写说明。
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # 手写说明可选。没有就不传 body_path，正文只剩 GitHub 生成的说明。
      - name: 组装正文
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"

          {
            echo "## 安装"
            echo
            echo '```bash'
            echo "pip install cakeui==${version}"
            echo "pip install \"cakeui-cli[build]==${version}\""
            echo '```'
            if [[ -f ".github/release-notes/${TAG}.md" ]]; then
              echo
              cat ".github/release-notes/${TAG}.md"
            else
              echo "::warning::.github/release-notes/${TAG}.md 不存在，正文只有自动生成的说明。"
            fi
          } > notes.md

          # 0.2.0a1 / 0.2.0rc1 这类预发布要标出来，否则会被当成稳定版推荐给所有人。
          prerelease=false
          if [[ "$version" =~ (a|b|rc|alpha|beta|dev)[0-9]*$ ]]; then
            prerelease=true
          fi

          cat notes.md
          {
            echo "body_path=notes.md"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.body_path }}
          generate_release_notes: true
          prerelease: ${{ steps.notes.outputs.prerelease }}
          # 产物已经在上面的 job 里校验过，这里只负责挂上去。
          files: dist/*
          fail_on_unmatched_files: true
